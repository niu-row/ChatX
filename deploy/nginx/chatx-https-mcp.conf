# ChatX HTTPS Streamable MCP + OAuth. Included within newrow.fun server block.
# The remote SSH forward binds only to 127.0.0.1 on this host.
location ~ ^/(?:mcp|chatx-oauth/(?:authorize|approve|token|register)|\.well-known/oauth-(?:authorization-server|protected-resource)(?:/mcp)?)$ {
    if ($scheme != https) { return 308 https://$host$request_uri; }
    client_max_body_size 5m;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_connect_timeout 3s;
}
