# Replacement for chatx-https-mcp.conf when switching from SSH -R to
# native WSS MCP. Include INSIDE your domain's HTTPS server block.
# Do NOT include this alongside the old SSH /mcp location block.
# Match the private local bind port from CHATX_RELAY_BIND (default 8787).
# The relay process must set CHATX_MCP_DESKTOP_ID to the chosen registered desktop.

location = /v1/ws/mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

location ~ ^/(?:mcp|chatx-oauth/(?:authorize|approve|token|register)|\.well-known/oauth-(?:authorization-server|protected-resource)(?:/mcp)?)$ {
    if ($scheme != https) { return 308 https://$host$request_uri; }
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 630s;
    proxy_send_timeout 630s;
    proxy_connect_timeout 3s;
}
