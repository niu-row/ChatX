[package]
name = "chatx-desktop"
version = "0.3.0"
description = "Tauri desktop console for ChatX"
authors = ["ChatX"]
edition = "2021"

[[bin]]
name = "chatx-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
