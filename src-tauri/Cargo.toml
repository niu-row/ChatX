[package]
name = "chatx-desktop"
version = "0.4.10"
description = "Tauri desktop console for ChatX"
authors = ["ChatX"]
edition = "2021"

[[bin]]
name = "chatx-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
socket2 = "0.6.5"
ring = "0.17.14"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.0"
base64 = "0.22.1"
chatx-relay-protocol = { path = "../relay-protocol" }
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "socks"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tungstenite = "0.29.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
libc = "0.2"
