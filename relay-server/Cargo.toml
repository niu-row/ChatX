[package]
name = "chatx-relay-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
futures-util = "0.3"
chatx-relay-protocol = { path = "../relay-protocol" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
